name: Validate font submissions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed validator and website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out submitted font data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: submission
          sparse-checkout: fonts
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install exact dependencies
        run: python -m pip install --require-hashes -r trusted/requirements.lock
      - name: Test trusted intake code
        run: python -m unittest discover -s trusted/tests -v
      - name: Validate and build submitted data with trusted code
        run: python trusted/scripts/catalog.py build --fonts submission/fonts
